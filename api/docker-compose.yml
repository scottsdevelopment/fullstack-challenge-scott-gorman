name: fullstack-challenge
services:
  app:
    build:
      context: ./docker
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis

  queue:
    build:
      context: ./docker
    working_dir: /var/www/html
    command: sh -lc "php artisan queue:work --tries=3 --timeout=90 --queue=default,weather"
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    restart: unless-stopped

  scheduler:
    build:
      context: ./docker
    working_dir: /var/www/html
    command: sh -lc "php artisan schedule:work"
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    restart: unless-stopped

  mysql:
    image: mysql:8
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: root

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
